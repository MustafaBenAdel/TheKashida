<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kashida Pro - Hybrid Engine</title>
    <style id="dynamic-fonts"></style>
    <style>
        :root {
            --bg-color: #323232;
            --panel-bg: #252525;
            --text-color: #dcdcdc;
            --accent-color: #1473e6;
            --accent-hover: #1782ff;
            --border-color: #444;
            --btn-bg: #4a4a4a;
            --btn-hover: #5a5a5a;
            --success-color: #2e8b57;
            --warning-color: #d98e04;
            --danger-color: #d9534f;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 100vh;
        }

        .sidebar {
            width: 100%;
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .workspace {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
        }

        .text-area-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-grow: 1;
        }

        textarea, .output-box {
            width: 100%;
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-size: 20px;
            font-family: Arial, sans-serif;
            resize: vertical;
            line-height: 1.8;
            min-height: 180px;
        }

        .output-wrapper {
            position: relative;
            display: flex;
            flex-grow: 1;
        }

        .output-box {
            overflow-y: auto;
            text-align: right;
            white-space: pre-wrap;
            min-height: 250px;
            flex-grow: 1;
            font-variant-ligatures: contextual common-ligatures;
            font-feature-settings: "liga" 1, "clig" 1, "calt" 1;
        }

        .copy-overlay-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #ccc;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            opacity: 0.3;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .copy-overlay-btn:hover {
            opacity: 1;
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        h1 { margin: 0; font-size: 18px; color: #fff; }
        h2 { margin: 0; font-size: 14px; color: #aaa; font-weight: normal; }

        .control-group {
            background-color: rgba(0,0,0,0.1);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
        input[type="range"] { width: 100%; height: 30px; }
        select { width: 100%; padding: 8px; background-color: #1e1e1e; color: #fff; border: 1px solid var(--border-color); border-radius: 4px; font-size: 13px; margin-bottom: 5px; cursor: pointer; }
        .checkbox-group { display: flex; gap: 10px; align-items: center; padding: 5px 0; cursor: pointer; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer;}
        label { cursor: pointer; }

        button { background-color: var(--accent-color); color: #fff; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.2s; width: 100%; }
        button:hover { background-color: var(--accent-hover); }
        .btn-success { background-color: var(--success-color) !important; }
        .btn-danger { background-color: var(--danger-color) !important; }
        .btn-secondary { background-color: var(--btn-bg); }
        .btn-secondary:hover { background-color: var(--btn-hover); }

        /* ستايل صندوق حالة المحرك */
        #engine-status {
            display: none; 
            margin-top: 10px; 
            padding: 10px; 
            border-radius: 5px; 
            font-size: 13px; 
            font-weight: bold; 
            text-align: center; 
            line-height: 1.6;
            transition: all 0.3s ease;
        }

        @media (min-width: 768px) {
            body { flex-direction: row; height: 100vh; overflow: hidden; }
            .sidebar { width: 330px; flex-shrink: 0; overflow-y: auto; }
            .workspace { overflow-y: auto; padding-right: 10px; }
            textarea, .output-box { resize: none; flex-grow: 1; min-height: 200px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <h1>Kashida Pro (Hybrid)</h1>
            <h2>النظام الهجين الذكي</h2>
        </div>

        <div class="control-group" style="border: 1px solid var(--success-color); background-color: rgba(46, 139, 87, 0.1);">
            <div style="font-size: 13px; margin-bottom: 8px; color: #dcdcdc; font-weight: bold;">التحكم المباشر في فوتوبيا:</div>
            <button id="auto-photopea-btn" style="background-color: var(--success-color); margin-bottom: 8px; padding: 10px; font-size: 16px;">✨ تطبيق الكشيدة بضغطة</button>
            <button id="remove-photopea-btn" class="btn-danger" style="padding: 10px; font-size: 14px;">❌ إزالة الكشيدة من البرنامج</button>
            
            <div id="engine-status"></div>
        </div>

        <div class="control-group">
            <div class="row">
                <span>أقصى كشيدة للكلمة</span>
                <span id="max-val">5</span>
            </div>
            <input type="range" id="max-kashida" min="1" max="30" value="5">
        </div>

        <div class="control-group">
            <div class="checkbox-group">
                <input type="checkbox" id="fill-box-mode">
                <label for="fill-box-mode" style="font-size: 14px; color: #a8e6cf; font-weight: bold;">تمديد إضافي لملء مساحة (Text Box)</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="random-mode" checked>
                <label for="random-mode" style="font-size: 14px;">توزيع عشوائي حقيقي (تغيير الشكل)</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="force-last-line" checked>
                <label for="force-last-line" style="font-size: 14px;">فرض الكشيدة على السطر الأخير</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="kurdish-mode">
                <label for="kurdish-mode" style="font-size: 14px;">تفعيل وضع كوردی</label>
            </div>
        </div>

        <button id="apply-btn">معاينة وتغيير التوزيع</button>
        <button id="remove-btn" class="btn-secondary">إزالة المعاينة</button>

        <div class="control-group" style="border: 1px solid var(--accent-color); margin-top: auto;">
            <div style="font-size: 13px; margin-bottom: 8px; color: #dcdcdc; font-weight: bold;">مكتبة الخطوط والأوزان (للمحرك الدقيق):</div>
            <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                <select id="font-selector" style="flex: 2;" title="عائلة الخط">
                    <option value="Arial, sans-serif">الافتراضي (Arial)</option>
                    <option value="'Segoe UI', Tahoma, sans-serif">Segoe UI</option>
                    <option value="'Times New Roman', Times, serif">Times New Roman</option>
                </select>
                <button id="add-font-btn" class="btn-secondary" style="flex: 1; padding: 0;" title="إضافة خطوط (تحديد متعدد)">➕ رفع</button>
                <input type="file" id="font-upload" accept=".ttf,.otf,.woff,.woff2" style="display:none;" multiple>
            </div>
            <select id="font-weight-selector" title="وزن الخط">
                <option value="400">عادي (Regular)</option>
                <option value="700">عريض (Bold)</option>
            </select>
            <div class="checkbox-group" style="margin-top: 8px;">
                <input type="checkbox" id="opentype-ligatures" checked>
                <label for="opentype-ligatures" style="font-size: 13px; color: #aaa;">تفعيل تشابك الحروف (Ligatures)</label>
            </div>
        </div>
    </div>

    <div class="workspace">
        <div class="text-area-container">
            <label style="font-size: 14px; color: #aaa;">النص الأصلي (اضغط Enter لفصل السطور):</label>
            <textarea id="input-text" placeholder="اكتب النص هنا..."></textarea>
        </div>
        <div class="text-area-container">
            <label style="font-size: 14px; color: #aaa;">النتيجة المنسقة:</label>
            <div class="output-wrapper">
                <div id="output-text" class="output-box"></div>
                <button id="copy-main-btn" class="copy-overlay-btn" title="نسخ النتيجة">📋 نسخ</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // النظام الهجين (Hybrid Settings)
        // ==========================================
        let activeEngine = 'pixel'; // الافتراضي

        // دالة تحديث صندوق الحالة أسفل الأزرار
        function updateEngineStatus(engine, fontName) {
            const statusBox = document.getElementById('engine-status');
            statusBox.style.display = 'block';
            
            if (engine === 'pixel') {
                statusBox.innerHTML = `✔️ تم تطبيق: <b>المحرك الدقيق</b><br><span style="font-size: 11.5px; font-weight: normal; color: #e0e0e0;">(تم التعرف على الخط: ${fontName})</span>`;
                statusBox.style.backgroundColor = 'rgba(46, 139, 87, 0.2)';
                statusBox.style.border = '1px solid var(--success-color)';
                statusBox.style.color = '#a8e6cf';
            } else {
                statusBox.innerHTML = `⚠️ تم تطبيق: <b>محرك الكثافة التقريبي</b><br><span style="font-size: 11.5px; font-weight: normal; color: #e0e0e0;">(الخط: ${fontName} غير مرفوع بالأداة)</span>`;
                statusBox.style.backgroundColor = 'rgba(217, 142, 4, 0.2)';
                statusBox.style.border = '1px solid var(--warning-color)';
                statusBox.style.color = '#ffd880';
            }
        }

        // ==========================================
        // إدارة الخطوط (IndexedDB)
        // ==========================================
        let db;
        const fontSelector = document.getElementById('font-selector');
        const weightSelector = document.getElementById('font-weight-selector');
        const dynamicFontsStyle = document.getElementById('dynamic-fonts');
        let fontFamiliesMap = {}; 
        
        const request = indexedDB.open("KashidaFontsDB_Pro", 2);
        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (db.objectStoreNames.contains('fonts')) db.deleteObjectStore('fonts'); 
            db.createObjectStore('fonts', { keyPath: 'id' });
        };
        request.onsuccess = function(e) { db = e.target.result; loadSavedFonts(); };

        function parseFontInfo(fileName) {
            let nameObj = fileName.substring(0, fileName.lastIndexOf('.')) || fileName;
            let family = nameObj; let weightName = 'Regular'; let weightVal = 400;
            const lower = nameObj.toLowerCase();
            if(lower.includes('thin') || lower.includes('100')) { weightName = 'Thin'; weightVal = 100; }
            else if(lower.includes('light') || lower.includes('300')) { weightName = 'Light'; weightVal = 300; }
            else if(lower.includes('bold') || lower.includes('700')) { weightName = 'Bold'; weightVal = 700; }
            family = family.replace(new RegExp(`[-_\\s]?(${weightName}|italic|100|200|300|400|500|600|700|800|900)($|[\\s_\\-])`, 'ig'), '');
            family = family.replace(/[-_]/g, ' ').trim() || 'UnknownFamily';
            family = family.replace(/[^a-zA-Z0-9\s]/g, '');
            return { family, weightName, weightVal };
        }

        document.getElementById('add-font-btn').addEventListener('click', () => document.getElementById('font-upload').click());
        document.getElementById('font-upload').addEventListener('change', async function(e) {
            const files = e.target.files; if(files.length === 0) return;
            document.getElementById('add-font-btn').textContent = '⏳ جاري...';
            const promises = Array.from(files).map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const info = parseFontInfo(file.name);
                        resolve({ id: file.name, family: info.family, weightName: info.weightName, weightVal: info.weightVal, data: event.target.result });
                    };
                    reader.readAsDataURL(file);
                });
            });
            const fontObjects = await Promise.all(promises);
            saveMultipleFontsToDB(fontObjects);
        });

        function saveMultipleFontsToDB(fonts) {
            const transaction = db.transaction(['fonts'], 'readwrite');
            const store = transaction.objectStore('fonts');
            fonts.forEach(font => store.put(font));
            transaction.oncomplete = function() {
                document.getElementById('add-font-btn').textContent = '➕ رفع';
                loadSavedFonts(fonts[0].family);
                activeEngine = 'pixel';
            };
        }

        function loadSavedFonts(familyToSelect = null) {
            const transaction = db.transaction(['fonts'], 'readonly');
            const store = transaction.objectStore('fonts');
            store.getAll().onsuccess = function(e) {
                const fonts = e.target.result;
                let css = ""; fontFamiliesMap = {};
                fonts.forEach(font => {
                    css += `@font-face { font-family: '${font.family}'; src: url('${font.data}'); font-weight: ${font.weightVal}; }\n`;
                    if (!fontFamiliesMap[font.family]) fontFamiliesMap[font.family] = [];
                    fontFamiliesMap[font.family].push({ name: font.weightName, val: font.weightVal });
                });
                dynamicFontsStyle.innerHTML = css;
                let optionsHtml = `<option value="Arial, sans-serif">الافتراضي (Arial)</option><option value="'Segoe UI', Tahoma, sans-serif">Segoe UI</option><option value="'Times New Roman', Times, serif">Times New Roman</option>`;
                Object.keys(fontFamiliesMap).forEach(fam => { optionsHtml += `<option value="${fam}">${fam}</option>`; });
                const currentVal = familyToSelect || fontSelector.value;
                fontSelector.innerHTML = optionsHtml;
                for(let i = 0; i < fontSelector.options.length; i++) {
                    if(fontSelector.options[i].value === currentVal) { fontSelector.selectedIndex = i; break; }
                }
                updateWeightSelector();
            };
        }

        function updateWeightSelector() {
            const selectedFamily = fontSelector.value; const currentWeight = weightSelector.value; 
            let weightOptions = '';
            if (fontFamiliesMap[selectedFamily]) {
                fontFamiliesMap[selectedFamily].forEach(w => { weightOptions += `<option value="${w.val}">${w.name} (${w.val})</option>`; });
            } else {
                weightOptions = `<option value="400">عادي (Regular)</option><option value="700">عريض (Bold)</option>`;
            }
            weightSelector.innerHTML = weightOptions;
            updateTextareasFont();
        }

        fontSelector.addEventListener('change', () => { activeEngine = 'pixel'; updateWeightSelector(); processTextWeb(); });
        weightSelector.addEventListener('change', () => { updateTextareasFont(); processTextWeb(); });

        function updateTextareasFont() {
            const font = fontSelector.value; const weight = weightSelector.value;
            document.getElementById('input-text').style.fontFamily = font;
            document.getElementById('output-text').style.fontFamily = font;
            document.getElementById('input-text').style.fontWeight = weight;
            document.getElementById('output-text').style.fontWeight = weight;
        }

        document.getElementById('opentype-ligatures').addEventListener('change', function() {
            const outBox = document.getElementById('output-text');
            if (this.checked) {
                outBox.style.fontVariantLigatures = 'contextual common-ligatures';
                outBox.style.fontFeatureSettings = '"liga" 1, "clig" 1, "calt" 1';
            } else {
                outBox.style.fontVariantLigatures = 'none';
                outBox.style.fontFeatureSettings = '"liga" 0, "clig" 0, "calt" 0';
            }
            processTextWeb(); 
        });

        // ==========================================
        // المحرك الهجين للكشيدة
        // ==========================================
        const measureDiv = document.createElement('div');
        measureDiv.style.position = 'absolute'; measureDiv.style.visibility = 'hidden'; measureDiv.style.whiteSpace = 'nowrap';
        document.body.appendChild(measureDiv);

        function measureText(text, element) {
            measureDiv.style.fontFamily = window.getComputedStyle(element).fontFamily;
            measureDiv.style.fontSize = window.getComputedStyle(element).fontSize;
            measureDiv.style.fontWeight = window.getComputedStyle(element).fontWeight;
            measureDiv.style.fontVariantLigatures = window.getComputedStyle(element).fontVariantLigatures;
            measureDiv.style.fontFeatureSettings = window.getComputedStyle(element).fontFeatureSettings;
            measureDiv.textContent = text || '.'; 
            return measureDiv.clientWidth;
        }

        const ARABIC = {
            kashidaChar: "\u0640",
            disconnected: ['\u0627', '\u0623', '\u0625', '\u0622', '\u0671', '\u062F', '\u0630', '\u0631', '\u0632', '\u0648', '\u0649', '\u0698'],
            priority1After: ['\u0633', '\u0634', '\u0635', '\u0636'], priority2Before: ['\u062F', '\u0647', '\u0629', '\u062A'], 
            priority3Before: ['\u0627', '\u0623', '\u0625', '\u0622', '\u0643'], priority4Before: ['\u0641', '\u0642', '\u0639', '\u0648'], 
            forbiddenWords: ['على', 'إلى', 'الى', 'إلا', 'الا', 'هذا', 'هذه', 'ذلك', 'تلك', 'عن', 'من', 'ما', 'لا', 'أن', 'إن', 'أو', 'في', 'كل', 'كان', 'له', 'لك', 'لي', 'بك', 'بي', 'هو', 'هي', 'أنا', 'نحن', 'هم'],
            kurdishLetters: ['\u067E', '\u0686', '\u06A4', '\u06AF', '\u0695', '\u06B5', '\u06C6', '\u06CE', '\u06D5'],
            kurdishExtendable: ['\u067E', '\u0686', '\u06A4', '\u06AF', '\u06B5', '\u06CE'], kurdishNoExtend: ['\u06C6', '\u06D5', '\u0695'],
            wideChars: ['س','ش','ص','ض','ط','ظ','ف','ق','ك','م','ه','ي'], narrowChars: ['ا','أ','إ','آ','ء','د','ذ','ر','ز','و','ل']
        };

        function trim(str) { return str.replace(/^\s+|\s+$/g, ''); }
        function removeDiacritics(text) { return text.replace(/[\u064B-\u0652\u0653-\u065F\u0670]/g, ''); }
        function isArabicChar(ch) {
            if(!ch) return false; const code = ch.charCodeAt(0);
            return (code >= 0x0600 && code <= 0x06FF) || (code >= 0x0750 && code <= 0x077F) || (code >= 0x08A0 && code <= 0x08FF) || (code >= 0xFB50 && code <= 0xFDFF) || (code >= 0xFE70 && code <= 0xFEFF);
        }
        function isPunctuation(ch) { if(!ch) return false; return '.,;:!?\u060C\u061B\u061F-_()[]{}"\'\u00AB\u00BB\u2018\u2019\u201C\u201D'.indexOf(ch) !== -1; }

        function calculateRelativeWeight(text) {
            let weight = 0; let clean = removeDiacritics(text);
            for(let i = 0; i < clean.length; i++) {
                let char = clean[i];
                if (ARABIC.wideChars.includes(char)) weight += 1.4;
                else if (ARABIC.narrowChars.includes(char)) weight += 0.6;
                else if (char === ' ' || char === '\u00A0' || char === ARABIC.kashidaChar) weight += 1.0;
                else weight += 1.0; 
            }
            return weight;
        }

        function canPlaceKashida(word, position, kurdishMode) {
            if (position < 0 || position >= word.length - 1) return false;
            const cleanWord = trim(word).toLowerCase();
            if (ARABIC.forbiddenWords.includes(cleanWord)) return false;
            if (trim(word).length < 3) return false;
            const current = word.charAt(position); const next = word.charAt(position + 1);
            if (!isArabicChar(current) || !isArabicChar(next)) return false;
            if (isPunctuation(current) || isPunctuation(next)) return false;
            if (kurdishMode) {
                if (ARABIC.kurdishNoExtend.includes(current)) return false;
                if (next === '\u06CE' && position === word.length - 2) return false;
            }
            if (ARABIC.disconnected.includes(current) || position === 0) return false;
            const LAM = '\u0644';
            if (current === LAM || next === LAM) return false;
            const isAlef = ['\u0627', '\u0623', '\u0625', '\u0622'].includes(current);
            const nextIsAlef = ['\u0627', '\u0623', '\u0625', '\u0622'].includes(next);
            if ((isAlef && next === LAM) || (current === LAM && nextIsAlef)) return false;
            if (next === '\u064A' || next === '\u0629') return false;
            return true;
        }

        function getPositionPriority(word, position, kurdishMode) {
            if (!canPlaceKashida(word, position, kurdishMode)) return -1;
            const current = word.charAt(position); const next = word.charAt(position + 1);
            let priority = 1;
            if (kurdishMode) {
                if (ARABIC.kurdishExtendable.includes(current)) priority += 12;
                if (ARABIC.kurdishExtendable.includes(next)) priority += 7;
            }
            if (ARABIC.priority1After.includes(current)) priority += 10;
            if (ARABIC.priority2Before.includes(next)) priority += 8;
            if (ARABIC.priority3Before.includes(next)) priority += 6;
            if (ARABIC.priority4Before.includes(next)) priority += 4;
            return priority;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function findKashidaPositions(word, maxPositions, kurdishMode, randomize) {
            let candidates = [];
            for (let i = 0; i < word.length - 1; i++) {
                let priority = getPositionPriority(word, i, kurdishMode);
                if (priority > 0) candidates.push({ position: i, priority: priority });
            }
            if (randomize) shuffleArray(candidates);
            else candidates.sort((a, b) => b.priority - a.priority);
            
            let positions = candidates.slice(0, maxPositions).map(c => c.position);
            positions.sort((a, b) => a - b); 
            return positions;
        }

        function insertKashida(word, positions, count) {
            if (positions.length === 0 || count <= 0) return word;
            let perPosition = Math.floor(count / positions.length);
            let remainder = count % positions.length;
            let result = []; let lastIndex = 0;
            for (let i = 0; i < positions.length; i++) {
                let pos = positions[i];
                result.push(word.substring(lastIndex, pos + 1));
                let kashidaCount = perPosition + (i < remainder ? 1 : 0);
                for (let k = 0; k < kashidaCount; k++) result.push(ARABIC.kashidaChar);
                lastIndex = pos + 1;
            }
            result.push(word.substring(lastIndex));
            return result.join('');
        }

        function processTextWeb() {
            const inputText = document.getElementById('input-text').value;
            const outputBox = document.getElementById('output-text');
            if(!inputText.trim()) { outputBox.innerHTML = ''; return; }

            const maxPerWord = parseInt(document.getElementById('max-kashida').value);
            const kurdishMode = document.getElementById('kurdish-mode').checked;
            const forceLastLine = document.getElementById('force-last-line').checked;
            const isRandomMode = document.getElementById('random-mode').checked;
            const isFillBox = document.getElementById('fill-box-mode').checked;

            const cleanInput = inputText.replace(new RegExp(ARABIC.kashidaChar, 'g'), '');
            const paragraphs = cleanInput.split(/\n/);
            
            let finalHtml = '';
            let allLines = [];
            
            paragraphs.forEach(para => {
                if(trim(para).length === 0) {
                    allLines.push({ words: [], isLastInPara: true });
                } else {
                    allLines.push({ words: para.split(' ').filter(w => trim(w).length > 0), isLastInPara: true });
                }
            });

            // المحرك الدقيق (بيكسل)
            if (activeEngine === 'pixel') {
                const style = window.getComputedStyle(outputBox);
                const paddingX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
                const maxContainerWidth = outputBox.clientWidth - paddingX;

                let longestLineWidth = 0;
                let longestLineIndex = -1;
                
                allLines.forEach((line, index) => {
                    let w = measureText(line.words.join(' '), outputBox);
                    if(w > longestLineWidth) { longestLineWidth = w; longestLineIndex = index; }
                });

                let actualTargetWidth = isFillBox ? maxContainerWidth : longestLineWidth;

                allLines.forEach((line, index) => {
                    if(line.words.length === 0) { finalHtml += '<br>'; return; }
                    let lineStr = line.words.join(' ');
                    
                    if (!isFillBox && index === longestLineIndex) { finalHtml += `<div>${lineStr}</div>`; return; }
                    if (line.isLastInPara && !forceLastLine && !isFillBox) { finalHtml += `<div>${lineStr}</div>`; return; }

                    let currentWidth = measureText(lineStr, outputBox);
                    let gap = actualTargetWidth - currentWidth;

                    if(gap > 5) {
                        let lineWords = [...line.words]; let wordData = [];
                        lineWords.forEach((word, wIdx) => {
                            let positions = findKashidaPositions(removeDiacritics(word), maxPerWord, kurdishMode, isRandomMode);
                            if(positions.length > 0) wordData.push({ index: wIdx, original: word, positions: positions, currentKashida: 0, maxKashida: maxPerWord });
                        });

                        let attempts = 0; let maxAttempts = gap * 2; 
                        while(gap > 0 && attempts < maxAttempts) {
                            attempts++;
                            let availableWords = wordData.filter(w => w.currentKashida < w.maxKashida);
                            if (availableWords.length === 0) { wordData.forEach(w => w.maxKashida += 1); availableWords = wordData; }
                            if (availableWords.length === 0) break;

                            availableWords.sort((a,b) => a.currentKashida - b.currentKashida);
                            let candidates = availableWords.filter(w => w.currentKashida === availableWords[0].currentKashida);
                            let targetWord = isRandomMode ? candidates[Math.floor(Math.random() * candidates.length)] : candidates[0];

                            targetWord.currentKashida++;
                            lineWords[targetWord.index] = insertKashida(targetWord.original, targetWord.positions, targetWord.currentKashida);
                            
                            let newWidth = measureText(lineWords.join(' '), outputBox);
                            if(newWidth > actualTargetWidth) {
                                targetWord.currentKashida--;
                                lineWords[targetWord.index] = insertKashida(targetWord.original, targetWord.positions, targetWord.currentKashida);
                                break;
                            }
                            gap = actualTargetWidth - newWidth;
                        }
                        finalHtml += `<div>${lineWords.join(' ')}</div>`;
                    } else { finalHtml += `<div>${lineStr}</div>`; }
                });

            } else {
                // المحرك التقريبي (الكثافة)
                let targetWeight = 0;
                let longestLineIndex = -1;
                
                allLines.forEach((line, index) => {
                    let w = calculateRelativeWeight(line.words.join(' '));
                    if(w > targetWeight) { targetWeight = w; longestLineIndex = index; }
                });

                if (isFillBox) targetWeight = targetWeight * 1.35;

                allLines.forEach((line, index) => {
                    if(line.words.length === 0) { finalHtml += '<br>'; return; }
                    let lineStr = line.words.join(' ');
                    
                    if (!isFillBox && index === longestLineIndex) { finalHtml += `<div>${lineStr}</div>`; return; }
                    if (line.isLastInPara && !forceLastLine && !isFillBox) { finalHtml += `<div>${lineStr}</div>`; return; }

                    let currentWeight = calculateRelativeWeight(lineStr);
                    let gap = targetWeight - currentWeight;

                    if(gap > 0.8) { 
                        let lineWords = [...line.words]; let wordData = [];
                        lineWords.forEach((word, wIdx) => {
                            let positions = findKashidaPositions(removeDiacritics(word), maxPerWord, kurdishMode, isRandomMode);
                            if(positions.length > 0) wordData.push({ index: wIdx, original: word, positions: positions, currentKashida: 0, maxKashida: maxPerWord });
                        });

                        let attempts = 0; let maxAttempts = gap * 2; 
                        while(gap > 0.8 && attempts < maxAttempts) {
                            attempts++;
                            let availableWords = wordData.filter(w => w.currentKashida < w.maxKashida);
                            if (availableWords.length === 0) { wordData.forEach(w => w.maxKashida += 1); availableWords = wordData; }
                            if (availableWords.length === 0) break;

                            availableWords.sort((a,b) => a.currentKashida - b.currentKashida);
                            let candidates = availableWords.filter(w => w.currentKashida === availableWords[0].currentKashida);
                            let targetWord = isRandomMode ? candidates[Math.floor(Math.random() * candidates.length)] : candidates[0];

                            targetWord.currentKashida++;
                            lineWords[targetWord.index] = insertKashida(targetWord.original, targetWord.positions, targetWord.currentKashida);
                            
                            let newWeight = calculateRelativeWeight(lineWords.join(' '));
                            if(newWeight > targetWeight + 0.5) { 
                                targetWord.currentKashida--;
                                lineWords[targetWord.index] = insertKashida(targetWord.original, targetWord.positions, targetWord.currentKashida);
                                break;
                            }
                            gap = targetWeight - newWeight;
                        }
                        finalHtml += `<div>${lineWords.join(' ')}</div>`;
                    } else { finalHtml += `<div>${lineStr}</div>`; }
                });
            }

            outputBox.innerHTML = finalHtml;
        }

        document.getElementById('apply-btn').addEventListener('click', () => {
            processTextWeb();
            const btn = document.getElementById('apply-btn');
            btn.textContent = 'تم المعاينة ✔️'; btn.classList.add('btn-success');
            setTimeout(() => { btn.textContent = 'معاينة وتغيير التوزيع'; btn.classList.remove('btn-success'); }, 1000);
        });

        document.getElementById('copy-main-btn').addEventListener('click', function() {
            const outputText = document.getElementById('output-text').innerText;
            if(!outputText) return;
            navigator.clipboard.writeText(outputText).then(() => {
                let btn = document.getElementById('copy-main-btn');
                btn.textContent = '✔️ تم'; btn.classList.add('btn-success');
                setTimeout(() => { btn.textContent = '📋 نسخ'; btn.classList.remove('btn-success'); }, 1500);
            });
        });

        document.getElementById('max-kashida').addEventListener('input', function() { document.getElementById('max-val').textContent = this.value; });
        document.getElementById('fill-box-mode').addEventListener('change', processTextWeb);
        document.getElementById('remove-btn').addEventListener('click', function() {
            let txt = document.getElementById('input-text').value;
            txt = txt.replace(new RegExp(ARABIC.kashidaChar, 'g'), ''); txt = removeDiacritics(txt);
            document.getElementById('input-text').value = txt; document.getElementById('output-text').innerHTML = txt.replace(/\n/g, '<div><br></div>');
            document.getElementById('engine-status').style.display = 'none'; // إخفاء الصندوق عند مسح النص
        });

        // ==========================================
        // الربط المباشر مع Photopea والتبديل الهجين
        // ==========================================
        let autoPushToPhotopea = false;

        function pushTextToPhotopea() {
            const outputText = document.getElementById('output-text').innerText;
            if (!outputText.trim()) return;
            const escapedText = outputText.replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\r").replace(/"/g, "\\\"");
            const script = `try { if (app.documents.length > 0) { var doc = app.activeDocument; var layer = doc.activeLayer; if (layer && layer.textItem) { layer.textItem.contents = "${escapedText}"; } } } catch(e) {}`;
            window.parent.postMessage(script, "*");
            const btn = document.getElementById('auto-photopea-btn');
            btn.innerHTML = "✔️ تم التحديث بنجاح";
            setTimeout(() => btn.innerHTML = "✨ تطبيق الكشيدة بضغطة", 2000);
        }

        window.addEventListener("message", function(e) {
            if (e.data === "done") return;
            if (e.data === "ERROR_NO_TEXT_LAYER") {
                alert("يرجى تحديد لاير نص (Text Layer) داخل البرنامج أولاً!");
                autoPushToPhotopea = false;
                document.getElementById('auto-photopea-btn').innerHTML = "✨ تطبيق الكشيدة بضغطة";
                document.getElementById('engine-status').style.display = 'none';
                return;
            }

            try {
                let layerData = JSON.parse(e.data);
                if (layerData && layerData.text) {
                    if (layerData.ligatures !== undefined) document.getElementById('opentype-ligatures').checked = layerData.ligatures;

                    let fontFound = false;
                    const photopeaFont = layerData.font.toLowerCase();
                    for (let i = 0; i < fontSelector.options.length; i++) {
                        let optionVal = fontSelector.options[i].value.toLowerCase();
                        if (photopeaFont.includes(optionVal.replace(/['",]/g, '').trim()) || optionVal.includes(photopeaFont.split('-')[0])) {
                            fontSelector.selectedIndex = i; fontFound = true; break;
                        }
                    }

                    if (fontFound || photopeaFont === "arial" || photopeaFont.includes("tahoma")) {
                        activeEngine = 'pixel';
                        updateWeightSelector();
                        updateEngineStatus('pixel', layerData.font);
                    } else {
                        activeEngine = 'density';
                        updateEngineStatus('density', layerData.font);
                    }

                    document.getElementById('input-text').value = layerData.text;
                    processTextWeb();
                    
                    if (autoPushToPhotopea) { setTimeout(() => { pushTextToPhotopea(); autoPushToPhotopea = false; }, 100); }
                }
            } catch (err) {
                if (typeof e.data === "string") {
                    document.getElementById('input-text').value = e.data; processTextWeb();
                    if (autoPushToPhotopea) { setTimeout(() => { pushTextToPhotopea(); autoPushToPhotopea = false; }, 100); }
                }
            }
        });

        document.getElementById('auto-photopea-btn').addEventListener('click', function() {
            autoPushToPhotopea = true; 
            const script = `try { var doc = app.activeDocument; var layer = doc.activeLayer; if (layer && layer.textItem) { var data = { text: layer.textItem.contents, font: layer.textItem.font, ligatures: layer.textItem.ligatures || false }; app.echoToOE(JSON.stringify(data)); } else { app.echoToOE('ERROR_NO_TEXT_LAYER'); } } catch(e) { app.echoToOE('ERROR_NO_TEXT_LAYER'); }`;
            window.parent.postMessage(script, "*");
            this.innerHTML = "⏳ جاري التطبيق...";
        });

        document.getElementById('remove-photopea-btn').addEventListener('click', function() {
            const script = `try { var doc = app.activeDocument; var layer = doc.activeLayer; if (layer && layer.textItem) { layer.textItem.contents = layer.textItem.contents.replace(/\\u0640/g, ''); } else { app.echoToOE('ERROR_NO_TEXT_LAYER'); } } catch(e) { app.echoToOE('ERROR_NO_TEXT_LAYER'); }`;
            window.parent.postMessage(script, "*");
            const originalText = this.innerHTML; this.innerHTML = "✔️ تمت الإزالة";
            document.getElementById('engine-status').style.display = 'none'; // إخفاء الصندوق عند إزالة الكشيدة
            setTimeout(() => this.innerHTML = originalText, 1500);
        });

    </script>
</body>
